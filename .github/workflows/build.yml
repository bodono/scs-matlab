name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum supported runtime; the ABI check allows no newer symbol imports.
  # Review when changing Linux/MATLAB support or runners (README checklist).
  SCS_LINUX_GLIBC_BASELINE: '2.31'

jobs:
  build-and-test:
    name: Build & Test MEX (${{ matrix.name }}, openmp=${{ matrix.openmp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            # 24.04 (glibc 2.39) leaked a GLIBC_2.38 import into a release MEX
            os: ubuntu-22.04
            matlab_release: R2022b
            mexext: mexa64
            openmp: false
            artifact: linux-x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            matlab_release: R2022b
            mexext: mexa64
            openmp: true
            artifact: linux-x86_64-openmp
          - name: Windows x86_64
            os: windows-latest
            matlab_release: R2022b
            mexext: mexw64
            openmp: false
            artifact: windows-x86_64
            extra_products: "MATLAB_Support_for_MinGW-w64_C/C++_Compiler"
          - name: macOS Apple Silicon
            os: macos-15
            matlab_release: R2023b
            mexext: mexmaca64
            openmp: false
            artifact: macos-arm64
          - name: macOS Apple Silicon
            os: macos-15
            matlab_release: R2023b
            mexext: mexmaca64
            openmp: true
            artifact: macos-arm64-openmp
          - name: macOS Intel
            os: macos-15-intel
            matlab_release: R2022b
            mexext: mexmaci64
            openmp: false
            artifact: macos-x86_64
        # The serial (openmp=false) build is what gets packaged into the
        # released .mltbx. The openmp=true build is a regression pin:
        # it links MATLAB's bundled OpenMP runtime instead of the compiler's
        # default runtime, and ``test/openmp_stress.m`` would diverge or
        # crash if a future change broke that integration. Windows has
        # no clean MATLAB-runtime link path today (see make_scs.m), so it
        # only builds serial. The Intel Mac build is retained for users of
        # MATLAB R2025b and earlier; OpenMP coverage runs natively on Apple
        # Silicon, which is the current macOS MATLAB architecture.
    runs-on: ${{ matrix.os }}
    env:
      # make_scs.m reads this env var to override its compile-time
      # ``use_open_mp`` default. See the env-var override block at the
      # top of make_scs.m.
      SCS_USE_OPENMP: ${{ matrix.openmp }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab_release }}
          products: ${{ matrix.extra_products || '' }}

      - name: Compile MEX
        uses: matlab-actions/run-command@v3
        with:
          command: make_scs

      - name: Verify MEX suffix
        uses: matlab-actions/run-command@v3
        with:
          command: |
            expectedMexext = '${{ matrix.mexext }}';
            assert(strcmp(mexext, expectedMexext), ...
                sprintf('Expected MATLAB mexext %s, got %s', expectedMexext, mexext));
            binaries = {'scs_direct', 'scs_indirect', 'scs_dense', ...
                        'scs_matlab_direct', 'scs_version'};
            for i = 1:numel(binaries)
                binary = fullfile('matlab', [binaries{i} '.' expectedMexext]);
                assert(isfile(binary), sprintf('Missing expected MEX binary: %s', binary));
            end

      - name: Check Linux MEX glibc ABI
        if: runner.os == 'Linux'
        run: |
          newest=$(objdump -T matlab/*.mexa64 | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          echo "newest glibc import: $newest (runtime baseline glibc $SCS_LINUX_GLIBC_BASELINE+)"
          printf '%s\nGLIBC_%s\n' "$newest" "$SCS_LINUX_GLIBC_BASELINE" | sort -VC

      - name: Test
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: ./
          select-by-folder: test

      # Only the serial build is packaged into the released .mltbx.
      # Skipping the upload for the openmp build keeps the package job
      # downloading exactly one MEX per platform.
      - name: Upload MEX artifact
        if: matrix.openmp == false
        uses: actions/upload-artifact@v7
        with:
          name: mex-${{ matrix.artifact }}
          path: |
            matlab/*.mex*
            !*.prj
            !*.mltbx

  package:
    name: Package .mltbx
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Download MEX binaries
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: matlab/

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          # R2026a uses the documented, architecture-neutral
          # SupportedPlatforms.Mac toolbox metadata field.
          release: R2026a

      - name: Package Toolbox
        uses: matlab-actions/run-command@v3
        with:
          command: package_scs

      - name: Upload Toolbox Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCS-toolbox
          path: SCS.mltbx

  test-toolbox:
    name: Test Toolbox (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            matlab_release: R2023a
            mexext: mexa64
          - name: Windows x86_64
            os: windows-latest
            matlab_release: R2023a
            mexext: mexw64
          - name: macOS Apple Silicon
            os: macos-15
            matlab_release: R2023b
            mexext: mexmaca64
          - name: macOS Intel
            os: macos-15-intel
            matlab_release: R2023a
            mexext: mexmaci64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Toolbox
        uses: actions/download-artifact@v8
        with:
          name: SCS-toolbox
          path: ./

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab_release }}

      - name: Smoke Test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            expectedMexext = '${{ matrix.mexext }}';
            assert(strcmp(mexext, expectedMexext), ...
                sprintf('Expected MATLAB mexext %s, got %s', expectedMexext, mexext));
            toolboxes = matlab.addons.toolbox.installedToolboxes;
            if ~isempty(toolboxes)
                matches = strcmp({toolboxes.Guid}, '9fe2fe4d-165e-4d2d-8511-91bcef1583b0');
                for i = find(matches)
                    matlab.addons.toolbox.uninstallToolbox(toolboxes(i));
                end
            end
            lastwarn('');
            installedToolbox = matlab.addons.toolbox.installToolbox('SCS.mltbx');
            [installWarning, installWarningId] = lastwarn;
            assert(isempty(installWarning), ...
                sprintf('Toolbox installation warned (%s): %s', installWarningId, installWarning));
            assert(strcmp(installedToolbox.Guid, '9fe2fe4d-165e-4d2d-8511-91bcef1583b0'));
            scsPath = which('scs');
            scsVersionPath = which('scs_version');
            assert(~isempty(scsPath), 'Installed toolbox did not put scs on the MATLAB path');
            assert(~isempty(scsVersionPath), 'Installed toolbox did not put scs_version on the MATLAB path');
            assert(contains(scsPath, [filesep 'matlab' filesep]), ...
                sprintf('Expected scs.m to come from installed toolbox matlab/ folder, got: %s', scsPath));
            assert(exist('scs_version', 'file') == 3, ...
                sprintf('Expected scs_version to resolve to a MEX file, got: %s', scsVersionPath));
            disp(scs_version);
            data.A = sparse(-1);
            data.b = -1;
            data.c = 1;
            cones.l = 1;
            [x, y, s, info] = scs(data, cones, struct('verbose', 0));
            assert(strcmp(info.status, 'solved'), info.status);
            assert(isfinite(x) && isfinite(y) && isfinite(s));
            [x, y, s, info] = scs(data, cones, struct('verbose', 0, 'use_qdldl', true));
            assert(strcmp(info.status, 'solved'), info.status);
            assert(isfinite(x) && isfinite(y) && isfinite(s));
            [x, y, s, info] = scs(data, cones, struct('verbose', 0, 'use_indirect', true));
            assert(strcmp(info.status, 'solved'), info.status);
            assert(isfinite(x) && isfinite(y) && isfinite(s));

  release:
    name: Create Release
    needs: test-toolbox
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Toolbox
        uses: actions/download-artifact@v8
        with:
          name: SCS-toolbox
          path: ./

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          files: SCS.mltbx
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
